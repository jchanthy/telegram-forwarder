services:
  - type: web
    name: telegram-forwarder
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: forwarder-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

